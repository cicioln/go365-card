# 用法：
#   启动：        docker compose up -d
#   查看安装码：  docker compose logs
#   更新到最新版：docker compose pull && docker compose up -d
#   本地改源码后构建：docker compose up -d --build
# 管理员账号、支付网关都在后台设置，一般不需要 .env；需要时参考 .env.example
# 固定项目名：默认取目录名，目录是中文时会变成空名报错
name: go365-card
services:
  shop:
    image: ${IMAGE:-ghcr.io/cicioln/go365-card:latest}
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # 容器内固定端口与数据目录，对外端口用 HOST_PORT 修改
      PORT: "3000"
      DATA_DIR: /app/data
    volumes:
      - shop-data:/app/data

volumes:
  # 数据库、上传图片、签名密钥都在这里，删除卷会丢失全部数据
  shop-data:
